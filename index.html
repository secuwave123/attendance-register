<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동출석체크기</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--text:#1f2328;--sub:#6b7280;--main:#2563eb;--ok:#16a34a;--no:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","맑은 고딕",sans-serif;font-size:16px}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:4px 0 16px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label{font-size:14px;color:var(--sub);display:block;margin-bottom:6px}
  input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;font-family:inherit}
  .clock{text-align:center;font-size:30px;font-weight:bold;margin:6px 0 2px}
  .date{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px}
  .big{width:100%;padding:18px;font-size:20px;font-weight:bold;color:#fff;background:var(--main);border:0;border-radius:12px;cursor:pointer}
  .big:disabled{opacity:.6}
  .btn{padding:9px 12px;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:inherit}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .msg{margin-top:12px;font-size:15px;text-align:center;min-height:20px}
  .ok{color:var(--ok)} .no{color:var(--no)}
  .item{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
  .item:first-child{border-top:0}
  .item b{font-size:15px}
  .item a{color:var(--main);text-decoration:none;margin-right:10px}
  .sub{color:var(--sub);font-size:13px}
  details summary{cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="display:flex;align-items:center;justify-content:center;gap:8px">
    <svg width="34" height="34" viewBox="0 0 100 100" aria-label="7번 당구공">
      <defs><radialGradient id="b7" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#6e1414"/></radialGradient></defs>
      <circle cx="50" cy="50" r="48" fill="url(#b7)"/>
      <circle cx="50" cy="50" r="22" fill="#fff"/>
      <text x="50" y="60" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial,sans-serif" fill="#111">7</text>
      <ellipse cx="34" cy="24" rx="12" ry="6" fill="#fff" opacity=".35"/>
    </svg>
    자동출석체크기
  </h1>
  <p class="sub" style="text-align:center;margin:-10px 0 14px">빌리어드테라피 · 대구 중구 명덕로35길 99, 3층</p>

  <div class="card">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>
    <label for="name">이름</label>
    <input id="name" placeholder="이름 입력 후 엔터 → 자동 출석" enterkeyhint="go" autocomplete="name">
    <p class="sub" style="margin:6px 0 0">처음 한 번만 이름을 입력하면, 다음부터는 앱을 열기만 해도 자동 출석됩니다.</p>
    <div style="height:12px"></div>
    <button class="big" id="checkBtn">출석하기</button>
    <div class="msg" id="msg"></div>
    <button class="big" id="kakaoBtn" style="display:none;margin-top:12px;background:#FEE500;color:#191919">💬 카톡방에 도착 알리기</button>
    <div id="kakaoHint" style="display:none;margin-top:10px">
      <p class="sub" style="text-align:center;margin:0 0 6px">버튼 → <b>카카오톡</b> → <b>오픈채팅방 선택</b> → 전송</p>
      <input id="kakaoBox" readonly style="text-align:center;font-weight:bold;background:#fffbe6">
      <p class="sub" id="copyState" style="text-align:center;margin:6px 0 0"></p>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <b>🎱 지금 당구장에 온 사람 <span class="sub">(최근 12시간)</span></b>
      <button class="btn" id="liveRefresh">새로고침</button>
    </div>
    <div id="liveList"><p class="sub">불러오는 중…</p></div>
  </div>

  <div class="card" id="placeCard">
    <details>
      <summary>⚙️ 출석 장소 설정 (선택)</summary>
      <p class="sub">출석 장소에서 「현재 위치를 출석 장소로」를 한 번 눌러두면, 이후 반경 안에서 출석했는지 표시됩니다.</p>
      <div class="row">
        <button class="btn" id="setPlace">현재 위치를 출석 장소로</button>
        <button class="btn" id="clearPlace">해제</button>
      </div>
      <div style="height:10px"></div>
      <label for="radius">허용 반경 (m)</label>
      <input id="radius" type="number" min="10" step="10" value="100">
      <p class="sub" id="placeInfo">출석 장소: 미설정</p>
    </details>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <b>출석 기록</b>
      <div class="row">
        <button class="btn" id="csvBtn">엑셀(CSV) 저장</button>
        <button class="btn" id="clearBtn">전체 삭제</button>
      </div>
    </div>
    <div id="list"><p class="sub">아직 기록이 없습니다.</p></div>
  </div>
</div>

<script>
// ===== 당구장 위치 설정 (여기 숫자만 바꾸면 됩니다) =====
const FIXED_PLACE = {
  name: '빌리어드테라피',               // 장소 이름
  address: '대구광역시 중구 명덕로35길 99, 3층',
  lat: 35.86105197,                     // 위도
  lng: 128.58968609,                    // 경도
  radius: 50                            // 허용 반경(m)
};
const OPENCHAT_URL = 'https://open.kakao.com/o/gnKCHmCe';   // 출석 알림 보낼 오픈채팅방
const NTFY_TOPIC = 'billiardtherapy-7k3m9q';                 // ntfy 알림 채널 이름 (ntfy 앱에서 이 이름 구독)
// =====================================================

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let records = store.get('att_records', []);
const HAS_FIXED = FIXED_PLACE.lat != null && FIXED_PLACE.lng != null;
let place = HAS_FIXED ? {lat:FIXED_PLACE.lat, lng:FIXED_PLACE.lng} : store.get('att_place', null);
const getRadius = () => HAS_FIXED ? FIXED_PLACE.radius : (Number($('radius').value)||100);
if(HAS_FIXED) document.getElementById('placeCard').style.display = 'none';

// 시계
const pad = n => String(n).padStart(2,'0');
function tick(){
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('date').textContent = d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
}
tick(); setInterval(tick, 1000);

// 이름·반경 기억
$('name').value = store.get('att_name','');
$('name').addEventListener('input', e => store.set('att_name', e.target.value.trim()));
$('radius').value = store.get('att_radius', 100);
$('radius').addEventListener('input', e => store.set('att_radius', Number(e.target.value)||100));

// 거리 계산(m)
function distance(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}

function getPos(){
  return new Promise((ok, fail) => {
    if(!navigator.geolocation) return fail(new Error('이 브라우저는 위치 기능을 지원하지 않습니다.'));
    navigator.geolocation.getCurrentPosition(
      p => ok({lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy)}),
      e => fail(new Error(e.code===1 ? '위치 권한을 허용해 주세요.' : '위치를 가져오지 못했습니다. 다시 시도해 주세요.')),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  });
}

const kakaoUrl = r => `https://map.kakao.com/link/map/${encodeURIComponent(r.name+' 출석')},${r.lat},${r.lng}`;
const naverUrl = r => `https://map.naver.com/p?c=${r.lng},${r.lat},17,0,0,0,dh`;

function showMsg(t, cls=''){ $('msg').className = 'msg '+cls; $('msg').textContent = t; }

function render(){
  $('placeInfo').textContent = place
    ? `출석 장소: 설정됨 (${place.lat.toFixed(5)}, ${place.lng.toFixed(5)})`
    : '출석 장소: 미설정';
  if(!records.length){ $('list').innerHTML = '<p class="sub">아직 기록이 없습니다.</p>'; return; }
  $('list').innerHTML = records.slice().reverse().map(r => {
    const range = r.dist==null ? '' :
      `<span class="${r.inRange?'ok':'no'}"> · ${r.inRange?'범위 안':'범위 밖'} (${r.dist}m)</span>`;
    return `<div class="item">
      <b>${r.name}</b> <span class="sub">${r.time}</span>${range}<br>
      <span class="sub">정확도 ±${r.acc}m</span><br>
      <a href="${kakaoUrl(r)}" target="_blank">카카오맵</a>
      <a href="${naverUrl(r)}" target="_blank">네이버맵</a>
    </div>`;
  }).join('');
}

async function checkIn(auto=false){
  const name = $('name').value.trim();
  if(!name){ if(!auto){ showMsg('이름을 먼저 입력해 주세요.','no'); $('name').focus(); } return; }
  const today = new Date().toLocaleDateString('ko-KR');
  if(records.some(r => r.name===name && r.day===today)){
    if(auto){ showMsg(`✅ ${name}님은 오늘 이미 출석했습니다.`,'ok'); showKakao({name}); return; }
    if(!confirm('오늘 이미 출석했습니다. 한 번 더 기록할까요?')) return;
  }
  if($('checkBtn').disabled) return;

  $('checkBtn').disabled = true; showMsg('위치 확인 중...');
  try{
    const p = await getPos();
    const now = new Date();
    const rec = {name, day:today, time: now.toLocaleString('ko-KR'), lat:p.lat, lng:p.lng, acc:p.acc, dist:null, inRange:null};
    if(place){
      rec.dist = distance(place, p);
      rec.inRange = rec.dist <= getRadius();
    }
    records.push(rec); store.set('att_records', records); render();
    if(rec.inRange===false) showMsg(`출석 기록됨 · ${FIXED_PLACE.name}에서 ${rec.dist}m 떨어져 있습니다.`,'no');
    else showMsg(`✅ ${name}님 출석 완료 (${pad(now.getHours())}:${pad(now.getMinutes())})`,'ok');
    showKakao(rec);
    sendNtfy(rec, now);
  }catch(e){ showMsg(e.message,'no'); }
  $('checkBtn').disabled = false;
}

// ===== ntfy 자동 출석 알림 =====
function sendNtfy(rec, now){
  if(!NTFY_TOPIC) return;
  const range = rec.inRange==null ? '' : (rec.inRange ? ' · 범위 안' : ` · 범위 밖(${rec.dist}m)`);
  fetch('https://ntfy.sh/', {
    method: 'POST',
    body: JSON.stringify({
      topic: NTFY_TOPIC,
      title: `${FIXED_PLACE.name} 출석`,
      message: `${rec.name}님 출석 (${pad(now.getHours())}:${pad(now.getMinutes())})${range}`,
      tags: [rec.inRange===false ? 'warning' : 'white_check_mark']
    })
  }).then(() => setTimeout(loadLive, 1500)).catch(()=>{});
}

// ===== 지금 온 사람 (ntfy 최근 12시간 기록) =====
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadLive(){
  if(!NTFY_TOPIC){ $('liveList').innerHTML = ''; return; }
  try{
    const txt = await fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=12h`).then(r => r.text());
    const people = new Map();
    txt.split('\n').forEach(line => {
      if(!line.trim()) return;
      let ev; try{ ev = JSON.parse(line); }catch(e){ return; }
      if(ev.event !== 'message' || !ev.message) return;
      const m = ev.message.match(/^(.+?)님 출석 \((\d{2}:\d{2})\)(.*)$/);
      if(!m) return;
      const prev = people.get(m[1]);
      if(!prev || ev.time > prev.t) people.set(m[1], {t: ev.time, hm: m[2], extra: m[3].replace(/^ · /,'')});
    });
    const list = [...people.entries()].sort((a,b) => b[1].t - a[1].t);
    $('liveList').innerHTML = list.length
      ? list.map(([n,v]) => `<div class="item"><b>${esc(n)}</b> <span class="sub">${esc(v.hm)}</span>${v.extra ? ` <span class="${v.extra.includes('밖')?'no':'ok'}">· ${esc(v.extra)}</span>` : ''}</div>`).join('')
      : '<p class="sub">아직 온 사람이 없어요.</p>';
  }catch(e){
    $('liveList').innerHTML = '<p class="sub">목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
  }
}
$('liveRefresh').addEventListener('click', loadLive);
loadLive();
setInterval(loadLive, 60000);

// ===== 카톡 출석 알림 =====
let kakaoText = '';
let copyFailedOnce = false;
function showKakao(rec){
  const d = new Date();
  kakaoText = `${rec.name}님 당구장 도착! 🎱 게임하실 분~`;
  $('kakaoBox').value = kakaoText;
  $('kakaoBtn').style.display = 'block';
  $('kakaoHint').style.display = 'block';
}
// 복사: 구형 방식(카톡 내장 브라우저용) + 최신 방식 둘 다 시도
function copyLegacy(t){
  const box = $('kakaoBox');
  box.value = t;
  box.removeAttribute('readonly');
  box.focus(); box.select(); box.setSelectionRange(0, t.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  box.setAttribute('readonly','');
  box.blur();
  return ok;
}
async function copyText(t){
  let ok = copyLegacy(t);
  try{ await navigator.clipboard.writeText(t); ok = true; }catch(e){}
  return ok;
}
$('kakaoBox').addEventListener('click', () => { $('kakaoBox').select(); });
$('kakaoBtn').addEventListener('click', async () => {
  // 1순위: 공유창 → 카카오톡 → 채팅방 선택 시 문구가 입력창에 채워짐
  if(navigator.share){
    try{ await navigator.share({ text: kakaoText }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  // 2순위: 복사 + 오픈채팅방 열기
  const ok = await copyText(kakaoText);
  $('copyState').textContent = ok
    ? '✅ 복사 완료! 채팅방으로 이동합니다…'
    : '⚠️ 자동 복사가 막혔어요. 위 문구를 길게 눌러 복사한 뒤, 버튼을 한 번 더 누르면 채팅방이 열려요.';
  if(!ok && !copyFailedOnce){ copyFailedOnce = true; $('kakaoBox').select(); return; }
  setTimeout(() => { location.href = OPENCHAT_URL; }, 700);
});

$('checkBtn').addEventListener('click', () => checkIn(false));
$('name').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); $('name').blur(); checkIn(false); }
});

$('setPlace').addEventListener('click', async () => {
  showMsg('출석 장소 위치 확인 중...');
  try{ const p = await getPos(); place = {lat:p.lat, lng:p.lng}; store.set('att_place', place); render(); showMsg('출석 장소를 저장했습니다.','ok'); }
  catch(e){ showMsg(e.message,'no'); }
});
$('clearPlace').addEventListener('click', () => { place = null; store.set('att_place', null); render(); });

$('csvBtn').addEventListener('click', () => {
  if(!records.length) return alert('저장할 기록이 없습니다.');
  const head = ['이름','일시','위도','경도','정확도(m)','장소와 거리(m)','범위'];
  const rows = records.map(r => [r.name, r.time, r.lat, r.lng, r.acc, r.dist??'', r.inRange==null?'':(r.inRange?'안':'밖')]);
  const csv = '\uFEFF' + [head, ...rows].map(a => a.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `출석기록_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});
$('clearBtn').addEventListener('click', () => {
  if(confirm('출석 기록을 모두 삭제할까요?')){ records = []; store.set('att_records', records); render(); }
});

render();
// 이름이 저장돼 있으면 앱을 열자마자 자동 출석
if($('name').value.trim()) checkIn(true);
</script>
</body>
</html>
